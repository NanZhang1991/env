# Embedding API 测试用例配置
# 所有可变的测试数据、期望值都在这里维护，改用例不用碰代码

connection:
  base_url_env: EMBEDDING_BASE_URL
  api_key_env: EMBEDDING_API_KEY
  timeout_seconds: 30

models:
  default: your-model-name
  large: your-model-large          # 用于dimensions裁剪测试
  compare_group:                   # 多模型对比测试的模型列表
    - your-model-name
    - your-model-large
  native_dim: 1536
  max_batch_size: 2048

# 期望的错误状态码——必须对照你要测的接口官方文档修改，这里只是常见惯例默认值
expected_status:
  empty_input: 400
  model_not_found: 404
  auth_failed: 401
  text_too_long: 400
  batch_over_limit: 400
  invalid_dimensions: 400
  invalid_encoding_format: 400

thresholds:
  single_latency_ms: 2000
  idempotency_min_cosine: 0.9999
  batch_vs_single_min_cosine: 0.999
  concurrency_min_cosine: 0.9999

sample_texts:
  batch_default:
    - 苹果很好吃
    - 今天天气不错
    - 北京是中国的首都
  multilingual:
    - text: "Hello world 你好世界"
      label: 中英混合
    - text: "こんにちは world 안녕하세요"
      label: 中日韩英混合
    - text: "🎉 emoji test 测试 🚀"
      label: emoji混合

encoding_format_test:
  # 底层模型推理精度不同，float/base64一致性校验的容忍度也应不同。
  # 硬件(NVIDIA/Ascend/TPU等)+精度组合会影响实际数值噪声水平，
  # 建议先用脚本实测真实误差分布(见README)，再按下表设置atol/rtol，
  # 不要凭感觉瞎猜，也不要设得比真实bug误差还宽。
  #
  # 常见dtype机器精度参考(仅供起点参考，不是标准值)：
  #   float16    epsilon ≈ 9.8e-4   建议 atol ≈ 1e-2 ~ 1e-3
  #   bfloat16   epsilon ≈ 7.8e-3   建议 atol ≈ 1e-2
  #   float32    epsilon ≈ 1.2e-7   建议 atol ≈ 1e-6
  #   float64    epsilon ≈ 2.2e-16  建议 atol ≈ 1e-9（一般用不到这么高精度）
  numeric_dtype: float32       # 默认模型底层推理/输出的数值精度，仅作说明用途
  atol: 1.0e-6
  rtol: 1.0e-5

  # 可选：不同模型跑在不同硬件/精度上时，按模型名单独覆盖阈值
  # 不在此列表里的模型使用上面的默认 atol/rtol
  overrides: []
  # 示例：
  # overrides:
  #   - model: your-model-on-ascend-fp16
  #     numeric_dtype: float16
  #     atol: 1.0e-2
  #     rtol: 1.0e-2
  #   - model: your-model-on-nvidia-fp32
  #     numeric_dtype: float32
  #     atol: 1.0e-6
  #     rtol: 1.0e-5

dimensions_test:
  valid_targets: [64, 256, 512]
  over_native_offset: 1000        # native_dim + 该值 = 非法值
  invalid_values: [0, -1]

# 边界输入用例：不假设所有case都是错误场景。
# 同一种边界输入(比如空字符串)在不同实现下行为可能完全不同——
# 例如 vLLM 把空字符串视为合法输入返回200，但空数组返回400。
# 每条用例可以直接写 expected_status(具体数字)，也可以用 expected_key
# 引用上面 expected_status 字典里的值；测试代码会按实际期望状态码
# 走不同的响应结构校验路径(2xx走成功schema校验，4xx/5xx走错误结构校验)。
boundary_cases:
  - name: 空字符串输入
    input: ""
    expected_status: 200        # 按你的接口实际行为调整：vLLM等实现是200，也有实现是400
  - name: 空数组输入
    input: []
    expected_key: empty_input
  - name: 模型不存在
    input: "测试"
    model_override: not-a-real-model-xyz
    expected_key: model_not_found
  - name: 鉴权失败
    input: "测试"
    api_key_override: invalid-key-000
    expected_key: auth_failed
  - name: 超长文本
    input_repeat: ["测试", 100000]   # 表示 "测试" * 100000
    expected_key: text_too_long

concurrency:
  workers: 10
  rate_limit_burst_count: 100

  # 异步并发(asyncio+httpx)通常可以设得比线程并发高很多，
  # 因为客户端协程调度开销远小于线程，能更真实地压出服务端上限
  async_workers: 50

  # 变长文本并发：短/中/长/超长各生成一批，同批混合并发，
  # 用于检测长文本是否让排在后面的短文本请求被迫饿死(队头阻塞)
  variable_length:
    short_chars: 10
    medium_chars: 300
    long_chars: 3000
    extreme_chars: 8000
    requests_per_length: 5   # 每种长度并发发多少条

  # 长尾延迟深挖：多轮重复跑，观察P99本身是否稳定，
  # 而不是只看单次P99数值
  tail_latency:
    rounds: 5
    workers_per_round: 10

  # 限流韧性：验证429之后按Retry-After退避是否最终能成功，
  # 而不只是验证"确实触发了429"
  rate_limit_resilience:
    max_retry_attempts: 5
    max_total_wait_seconds: 30
    burst_count: 100

  # 闭环监控(轻量版)：把关键指标写入本地历史记录文件，
  # 下次跑测试时与历史均值对比，发现明显劣化时警告(不是硬失败)。
  # 这不是完整监控系统，只是给pytest加一点"趋势感知"能力，
  # 生产级持续监控告警应该推给Prometheus/Grafana等专门工具。
  monitoring:
    history_file: .embedding_perf_history.jsonl
    history_window: 7              # 跟最近几次历史记录的均值对比
    regression_warn_ratio: 1.5     # 当前P95超过历史均值的多少倍时警告

    # 服务端指标采集(真正的"闭环")：压测的同时同步抓服务端的Prometheus指标，
    # 把客户端观测到的延迟和服务端的真实负载状态关联起来看。
    # 留空则跳过服务端指标采集，只做客户端侧的趋势对比。
    # vLLM等推理框架默认在服务本身暴露 /metrics 端点(Prometheus文本格式)，
    # 不需要额外部署Prometheus，直接抓这个地址就行；具体端口/路径以你的
    # 部署配置为准，一般是 http://<推理服务地址>:<端口>/metrics
    server_metrics_url: ""
    # 关心哪些指标(vLLM为例，不同版本/框架指标名可能不同，需要按实际/metrics输出核对)
    server_metrics_of_interest:
      - vllm:num_requests_running
      - vllm:num_requests_waiting
      - vllm:num_requests_swapped
      - vllm:gpu_cache_usage_perc
    queue_saturation_warn_threshold: 0   # 压测结束后等待队列若仍大于此值，说明积压没消化完
    gpu_cache_warn_ratio: 0.9            # gpu_cache_usage_perc超过该比例时警告显存紧张
