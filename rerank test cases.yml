# Rerank API 测试用例配置
# 所有可变的测试数据、期望值都在这里维护，改用例不用碰代码

connection:
  base_url_env: RERANK_BASE_URL
  api_key_env: RERANK_API_KEY
  timeout_seconds: 30

models:
  default: your-rerank-model
  max_documents: 1000          # 接口支持的最大文档数量上限，按实际接口调整

# 期望的错误状态码——必须对照你要测的接口官方文档修改，这里只是常见惯例默认值
expected_status:
  empty_query: 400
  empty_documents: 400
  model_not_found: 404
  auth_failed: 401
  too_many_documents: 400
  invalid_top_n: 400
  document_too_long: 400
  invalid_document_format: 400

thresholds:
  single_latency_ms: 3000
  # 幂等性检查：同一query+documents两次调用，relevance_score差异不应超过这个绝对值
  idempotency_max_score_diff: 0.01

sample_query: "什么是向量检索"
sample_documents:
  - "向量检索是一种基于向量相似度进行内容匹配的检索技术"
  - "苹果是一种常见的水果，富含维生素"
  - "北京是中国的首都"
  - "向量数据库常用于存储embedding并支持相似度搜索"
  - "今天天气晴朗，适合出门散步"

top_n_test:
  valid_values: [1, 3, 5]
  over_document_count_offset: 100   # top_n = 文档数 + 该偏移量，验证超过文档数时的行为
  # 注意：top_n=0 和负数属于错误场景，放在下面 boundary_cases 里测，不在这里重复

multi_document_test:
  # 覆盖"文档数>10"这个要求，多个规模档位一起测
  document_counts: [15, 30, 60]
  # 大批量文档基于下面的模板动态生成(模板+序号)，不逐条写死在yaml里
  text_template: "这是第{i}条候选文档，内容与向量检索、搜索排序相关的第{i}种表述方式"

document_object_format_test:
  # 有的rerank接口documents既可以是纯字符串数组，也可以是对象数组(如 {"text": "..."})
  # 具体字段名以你实际接口文档为准，这里用text作为示例字段名
  object_field_name: text
  mixed_format_should_error: true   # 字符串和对象混用在同一个documents数组里，是否应该报错

concurrency:
  workers: 10
  async_workers: 50          # 异步并发数，通常可以比线程并发设更高

  rate_limit_resilience:
    burst_count: 100
    max_retry_attempts: 5
    max_total_wait_seconds: 30

  tail_latency:
    rounds: 5
    workers_per_round: 10

  # rerank独有：文档数和并发数会互相放大压力，两个维度要一起测，
  # 而不是像embedding那样只关心并发数一个维度。
  # 组合数 = len(doc_counts) x len(worker_counts)，数值不要设太大，
  # 否则这条用例会跑很久(已标记为slow)。
  doc_count_concurrency_matrix:
    doc_counts: [5, 20, 50]
    worker_counts: [5, 20, 50]

  monitoring:
    history_file: .rerank_perf_history.jsonl
    history_window: 7
    regression_warn_ratio: 1.5
    # 服务端指标采集，同embedding套件，用法参考embedding套件README
    server_metrics_url: ""
    server_metrics_of_interest:
      - vllm:num_requests_running
      - vllm:num_requests_waiting
      - vllm:num_requests_swapped
      - vllm:gpu_cache_usage_perc
    queue_saturation_warn_threshold: 0
    gpu_cache_warn_ratio: 0.9

boundary_cases:
  - name: 空query
    use_sample_query: false
    query: ""
    use_sample_documents: true
    expected_key: empty_query
  - name: 空文档列表
    use_sample_query: true
    documents: []
    expected_key: empty_documents
  - name: 模型不存在
    use_sample_query: true
    use_sample_documents: true
    model_override: not-a-real-model-xyz
    expected_key: model_not_found
  - name: 鉴权失败
    use_sample_query: true
    use_sample_documents: true
    api_key_override: invalid-key-000
    expected_key: auth_failed
  - name: 文档数超过上限
    use_sample_query: true
    documents_repeat: ["候选文档内容", 2000]   # 表示 ["候选文档内容"] * 2000
    expected_key: too_many_documents
  - name: top_n为负数
    use_sample_query: true
    use_sample_documents: true
    top_n: -1
    expected_key: invalid_top_n
  - name: top_n为0
    use_sample_query: true
    use_sample_documents: true
    top_n: 0
    expected_key: invalid_top_n
  - name: 单条文档超长
    use_sample_query: true
    documents_repeat_long: ["超长文档内容片段", 50000]  # 表示 ["超长文档内容片段"*50000]
    expected_key: document_too_long
