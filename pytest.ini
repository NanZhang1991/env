[pytest]
# 确保 UserWarning 不会被默认或历史遗留的过滤规则吞掉/变成error，
# 保证 conftest.py 里的 warnings 收集机制能正常工作。
filterwarnings =
    always::UserWarning

# 注册自定义marker，避免PytestUnknownMarkWarning。
# 注意：markers必须在ini文件(或conftest.py的顶层pytest_configure钩子)里注册，
# 写在普通测试文件(test_*.py)里的pytest_configure不会被pytest当插件加载，不会生效。
markers =
    slow: 耗时较长的用例(并发/限流探测)
    calibration: 阈值校准用诊断用例，不随主套件默认运行
